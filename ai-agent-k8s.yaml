apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agent-zero-trust-role
rules:
  - apiGroups: ["policies.kyverno.io"]
    resources: ["validatingpolicies"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-zero-trust-binding
subjects:
  - kind: ServiceAccount
    name: ai-agent-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: ai-agent-zero-trust-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zero-trust-ai-agent
  template:
    metadata:
      labels:
        app: zero-trust-ai-agent
    spec:
      serviceAccountName: ai-agent-sa
      containers:
        - name: ai-agent
          image: zero-trust-ai-agent:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-service
  namespace: default
spec:
  selector:
    app: zero-trust-ai-agent
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
