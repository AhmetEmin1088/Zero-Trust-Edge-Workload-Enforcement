apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: schedule-kill-secure-nginx
  namespace: default
spec:
  schedule: "@every 15s"
  historyLimit: 2
  concurrencyPolicy: 'Forbid'
  type: 'PodChaos'
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces:
        - default
      labelSelectors:
        app: secure-web
