apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-zero-trust-workload
spec:
  failurePolicy: Fail 
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods"]
  validations:
    # We added 'chaos-mesh' to the VIP Lane
    - expression: "request.namespace in ['kube-system', 'kyverno', 'monitoring', 'chaos-mesh'] || object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)"
      message: "ZERO TRUST VIOLATION: Running as root is strictly forbidden in this Edge Node!"
