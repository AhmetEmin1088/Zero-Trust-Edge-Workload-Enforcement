apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: enforce-zero-trust-workload
spec:
  # failurePolicy: Fail means "Enforce". If we used "Ignore", it would just be "Audit" mode.
  failurePolicy: Fail 
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods"]
  validations:
    - expression: "object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)"
      message: "ZERO TRUST VIOLATION: Running as root is strictly forbidden in this Edge Node!"
